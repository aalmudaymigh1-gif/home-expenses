<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<title>مصاريف البيت</title>
<!--
  مصاريف البيت: السائق وعامل النظافة، فواتير مشترياتهم بالبطاقة، ورواتبهم.
  - المشرفين (أبوي وأختي) يدخلون برابط دخول خاص يتحول لجلسة في الجوال.
  - صفحة الموظف: الرابط ?e=<رمزه>، ويطلع من «الإعدادات».
  - القاعدة: Supabase (مشروع home-expenses). ملفات SQL والاختبارات في الريبو الخاص home-expenses-dev.
-->
<style>
:root{--green-line:#CFE1D5;--red-row:#FDF8F7;
--amber:#C2954A;--amber-soft:#F8F1E4;--slate:#5E6B7D;
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
svg.i{flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:520px;margin:0 auto;padding:12px 18px 0}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:30px 2px 4px}
h1{margin:0;line-height:1.35}
.top .sub{margin-top:2px}
.sub{color:var(--muted);font-size:13px}
.rf{width:42px;height:42px;border-radius:var(--r);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s var(--ease),background .15s}
.rf:active{transform:scale(.94);background:var(--fill)}
.rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;white-space:nowrap;cursor:pointer;transition:background .2s var(--ease),color .2s,transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button.on{background:var(--text);font-weight:600}

#view{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{animation:cardIn .4s var(--ease) both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}.card:nth-child(n+5){animation-delay:.16s}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lab,.lbl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 9px}
.lab svg,.lbl svg{color:var(--faint)}
.grp{color:var(--muted);font-size:12px;margin:10px 0 6px;font-weight:600}

.card{margin-bottom:12px}
.ctitle{display:flex;align-items:center;gap:8px}
.ctitle .ci{border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.ctitle .sp{margin-right:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row+.row{margin-top:4px}
.hair{border-top:1px solid var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.emp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.emp::-webkit-scrollbar{display:none}

.segc{display:flex;border-radius:var(--r)}
.segc button{font-size:14px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.segc button.on{font-weight:600}
.gr{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;position:relative;width:100%;background:none;border:0;text-align:right;cursor:pointer;transition:background .2s}
.gr+.gr:before{content:"";position:absolute;top:0;right:58px;left:0;height:1px;background:var(--line)}
.gr:active{background:var(--fill)}
.gr .n{flex:1;font-size:15px}
.gr .n small{display:block;font-size:12px;color:var(--muted)}
.gr.off{background:var(--red-row)}
.mk{flex:none;display:flex;transition:transform .2s var(--ease)}
.mk.ok{color:#4F8463}.mk.no{color:#B05A52}
.gr:active .mk{transform:scale(.85)}
.badge{font-size:12px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);color:var(--green)}
.badge.late{background:var(--red-soft);color:var(--red)}
.badge.n{background:var(--fill);color:#374151}
.badge.a{background:var(--amber-soft);color:#85642B}

textarea,input{width:100%;border:1.5px solid transparent;color:var(--text);font:inherit;padding:12px 14px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 3px var(--acc-ring)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:60px;resize:none}
input[type=date]{color-scheme:light;margin-top:8px}
.field{margin-bottom:12px}.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;font-weight:600}

.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);cursor:pointer;text-decoration:none;font-weight:600;transition:transform .12s var(--ease),opacity .2s,background .2s}
.btn:active,.btn2:active{transform:scale(.97)}
.btn{width:100%;max-width:484px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border:0;font-size:15px;padding:15px;box-shadow:0 8px 20px rgba(31,58,95,.22)}
.btn2{color:var(--text);font-size:14px;padding:10px 12px}
.btn2.arm{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}

.btn:disabled,.btn2:disabled{opacity:.45}
.sum{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sum .badge:last-child{margin-right:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fill);border:1.5px solid transparent;color:var(--text);font-size:14px;border-radius:var(--r);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .2s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.chip.add{background:transparent;border:1.5px dashed var(--line2);color:var(--acc)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kpi{padding:12px 14px}
.kpi .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi .v{line-height:1.3;letter-spacing:-.3px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}

.note{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.note svg{margin-top:2px}
.note.good{background:var(--green-soft);color:#3A6249}
.note.bad{background:var(--red-soft);color:#7E3F39}
.note b{font-weight:600}

.ent{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.ent:first-child{border-top:0}
.ico{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.ico.s{background:var(--amber-soft);color:var(--amber)}
.ico.m{background:var(--red-soft);color:var(--red)}
.ico.f{background:var(--acc-soft);color:var(--acc)}
.ent .t{flex:1;min-width:0}
.ent .d{color:var(--muted);font-size:12px}
.ent .p{font-size:13px;font-weight:600;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.ent .p.amt{direction:rtl}
.del{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:4px;border-radius:8px}
.del:active{background:var(--fill)}
.del.arm{color:var(--red);font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}.cu{color:var(--acc)}

.tbl{width:100%;font-size:14px;border-collapse:collapse}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:left;white-space:nowrap;font-weight:600}
.tbl tr.tot td{font-weight:600;font-size:15px;border-top:1.5px solid var(--line2);padding-top:11px}
.hist{display:grid;grid-template-columns:1.4fr auto auto auto;gap:8px 14px;font-size:14px;align-items:center}
.hist .h{color:var(--muted);font-size:12px;font-weight:600}

.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.load{color:var(--muted);text-align:center;padding:90px 20px}
.load .ei{width:64px;height:64px;border-radius:20px;background:var(--fill);color:var(--faint);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.link{direction:ltr;font-size:12px;word-break:break-all;color:var(--muted);background:var(--fill);border-radius:10px;padding:10px;margin:10px 0}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 0;cursor:pointer;margin:18px 0 0;display:inline-flex;align-items:center;gap:6px}

.task{border-top:1px solid var(--line);padding:13px 0}
.task:first-of-type{border-top:0}
.task.late b{color:var(--red)}
.task.done b{color:var(--muted);font-weight:500}
.task b{font-weight:600}
.madd{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--acc);font-size:12px;cursor:pointer;text-align:center;line-height:1.3}
.mbtn{background:var(--acc-soft);border:0;color:var(--acc);font-size:13px;font-weight:600;border-radius:10px;padding:7px 11px;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:6px}

#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:200% 0}to{background-position:-200% 0}}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .15s}
.hide{display:none}
input,textarea,select{font-size:16px}
select{width:100%;border:1.5px solid transparent;color:var(--text);font:inherit;font-size:16px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.sc{display:flex;border:2px solid transparent;cursor:pointer;text-align:right;background:var(--acc-soft);color:var(--acc);transition:transform .12s var(--ease)}
.sc:active{transform:scale(.97)}
.sc b{font-weight:600}.sc span{font-weight:600}
.sc.a{background:var(--amber-soft);color:#85642B}.sc.r{background:var(--red-soft);color:var(--red)}
.sc.on{border-color:currentColor}.sc.z{opacity:.55}

.chip.on.u{border-color:var(--red);background:var(--red-soft);color:var(--red)}

.lnk{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--acc);padding:8px 0 0;cursor:pointer;align-self:flex-start}
.sech{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 2px}
.sech span{font-size:12px;font-weight:600;color:#4B5563;background:var(--fill);border-radius:999px;padding:0 8px}
.sech.a{color:#85642B}.sech.r{color:var(--red)}.sech.m{color:var(--muted)}

.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.th .badge{flex:none}
.tt{font-size:15px;font-weight:600;line-height:1.45}.tt.l{color:var(--red)}.tt.d{color:var(--muted);font-weight:500;text-decoration:line-through}
.tm{font-size:13px;color:var(--muted)}

.btn2.rd{color:var(--red);border-color:var(--red-line);font-weight:600}
.dtog{width:100%;background:none;border:0;text-align:right;font-size:13px;font-weight:600;color:var(--green);padding:16px 0 6px;cursor:pointer}
.fab{position:fixed;left:18px;width:58px;height:58px;border-radius:50%;color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;padding:0}
.fab.hide{display:none}
#ov{display:none}#ov.on{display:block;position:fixed;inset:0;z-index:20}
.ovl{position:absolute;inset:0;background:rgba(15,20,25,.38);display:flex;flex-direction:column;justify-content:flex-end;animation:ovIn .2s}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto;animation:shIn .28s var(--ease)}
.ovl.na,.ovl.na .sheet{animation:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);align-self:center;margin-bottom:4px;flex:none}
@keyframes shIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.shh{font-size:13px;font-weight:600;color:var(--muted)}
.qtt{font-size:17px;font-weight:600;background:transparent;border:0;border-bottom:1.5px solid var(--acc);border-radius:0;padding:8px 2px}
.qtt:focus{background:transparent;box-shadow:none}

.g21{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.g21 .btn2{padding:13px;font-size:15px}

.dprops{border:1px solid var(--line);border-radius:var(--r2);margin-top:12px;overflow:hidden}
.dp{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 14px;border-bottom:1px solid var(--line);min-height:52px}
.dp:last-child{border-bottom:0}
.dp>span{color:var(--muted);font-size:14px;flex:none}
.dp select,.dp input{width:auto;max-width:65%;background:transparent;border:0;padding:8px 4px;margin:0;font-weight:600;font-size:15px;text-align:left}
.dp input.lt{color:var(--red)}

.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;display:block}
.pph{aspect-ratio:1;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.full{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#000}
.etabs{margin-top:14px}

.bigdo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 16px;font-size:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.bigdo:active{transform:scale(.97)}
.pform{margin-top:12px;background:var(--fill);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pform input{background:var(--surface)}
.pform .btn{box-shadow:none;max-width:none}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:78px;height:78px}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.ivr{padding:12px 0;border-bottom:1px solid var(--line)}
.ivr:last-child{border-bottom:0}
.ivr.rv{border:1px solid var(--amber-line,#EBDCBE);border-radius:var(--r2);padding:12px 14px;margin-top:10px;background:var(--surface)}
.iva{font-size:15px;font-weight:600;white-space:nowrap;flex:none}.iva.g{color:var(--green)}.iva.r{color:var(--red)}
.ivr .lnk.dl{color:var(--muted);font-size:13px;padding-top:6px}.ivr .lnk.dl.arm{color:var(--red)}
.shot .x{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:32px;padding:0;cursor:pointer}
.stc{border-radius:16px;padding:14px 16px;margin:12px 0}
.stc .l{font-size:13px;opacity:.85}.stc .v{font-size:17px;font-weight:600;margin:2px 0 6px}.stc .v small{font-size:13px;font-weight:500;opacity:.8}
.stc .r{display:flex;justify-content:space-between;font-size:13px;opacity:.92}
.str{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.str:last-child{border-bottom:0}.str .tm{margin-top:2px}
/* الإصدار 95: السطر اللي ينضغط كان ينشال خطه الفاصل بالغلط (هو آخر عنصر داخل زره دائماً) */
.strb .str{border-bottom:1px solid var(--line)}.strb:last-child .str{border-bottom:0}
/* الإصدار 95: سطور الحركات والفواتير أخف: العنوان 14 متوسط والمبلغ 14 */
.str{font-size:14px;padding:9px 0}.str>span>b:first-child{font-size:14px;font-weight:500!important}.str .iva{font-size:14px}
.str .ed{background:none;border:0;color:var(--muted);padding:4px;cursor:pointer}
.str .ed,.slp .ed{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.slp .ed{background:none;border:0;color:var(--muted);cursor:pointer;vertical-align:middle}
.ent .del{min-width:40px;justify-content:center}
.slnx{margin:8px 2px 0}.slnx b{color:var(--red);font-weight:600}
.ob{display:inline-block;background:var(--red-soft);color:var(--red);border-radius:5px;padding:0 5px;font-size:12px;font-weight:500;line-height:18px;margin-inline-start:4px;vertical-align:1px}
.gb{display:inline-block;background:var(--green-soft);color:#3A6249;border-radius:5px;padding:0 5px;font-size:12px;font-weight:500;line-height:18px;margin-inline-start:4px;vertical-align:1px}
.empv .ob{background:#F8F1E4;color:#85642B}.stc .bigdo{background:#fff;color:#B05A52;width:100%;justify-content:center;border:0;margin-top:10px;font-family:inherit;cursor:pointer}
.cb{display:inline-block;background:var(--amber-soft);color:#85642B;border-radius:5px;padding:0 5px;font-size:12px;font-weight:500;line-height:18px;margin-inline-start:4px;vertical-align:1px}
.wb{display:inline-block;background:#EDF3F8;color:#4F7493;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;margin-inline-start:4px;vertical-align:1px}
.wl{font-size:13px;font-weight:600;white-space:nowrap}.wl.ok{color:var(--green)}.wl.soon{color:#C2954A}.wl.end{color:var(--faint)}
.ivd h3{margin:0;font-size:17px}.ivd .amt{font-size:17px;font-weight:600;margin:4px 0 2px}
.ivd .pgrid{margin:10px 0}.ivd .btn2{width:100%;margin-top:8px}

.strb{width:100%;background:none;border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;padding:0}
.ilinks{display:flex;gap:16px}
.wchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wchips button{border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px}
.tgl input{width:20px;height:20px;accent-color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tst{gap:14px}
.tst>span{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);line-height:1.25}
.tst b{font-size:17px;color:var(--text)}

.ctitle .ci.dedi{background:var(--red-soft);color:var(--red)}
.dedch{display:flex;gap:6px;flex-wrap:wrap}
.dedch button{font:inherit;font-size:13px;border-radius:999px;cursor:pointer}
.tst{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;height:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.ti{position:absolute;top:0;width:min(360px,calc(100% - 24px));display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);padding:11px 13px;box-shadow:0 10px 30px rgba(15,20,25,.13);transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;transform-origin:top center;cursor:pointer}
.tic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ti.ok .tic{background:var(--green)}.ti.er .tic{background:var(--red)}.ti.in .tic{background:var(--acc)}
.ti.ld .tic{border:2.5px solid var(--acc-ring);border-top-color:var(--acc);animation:tspin .8s linear infinite}

#ov .sheet:has(#shm)>*{flex-shrink:0}
/* الإصدار 67 */
.rpcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px 10px;margin-top:14px}
.rch.rchx{cursor:pointer;min-height:44px;margin-top:-8px;margin-bottom:-4px}.rchv{margin-inline-start:auto;color:var(--muted);display:flex}.rpcard.lt.cl .rch.rchx{margin-bottom:-8px}
.rpcard .rch{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:2px}
.rpcard .rch .ci{width:28px;height:28px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--acc-dk)}
.rpcard .rch .cn{margin-inline-start:auto;font-size:12px;font-weight:500;color:var(--muted);background:var(--fill);border-radius:999px;padding:2px 9px}
.rpcard.lt .rch .ci{color:#85642B;background:#F8F1E4}
/* الإصدار 86: بانتظار الاعتماد، الإرجاع، التنبيهات، شريط فشل التحديث */
.rpcard.pd{border-color:#EBDDBF;background:#FFFCF6}
.rpcard.pd .rch .ci{color:#85642B;background:var(--amber-soft)}

.rfbar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#2A2A28;color:#fff;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.rfbar.adm{bottom:calc(84px + env(safe-area-inset-bottom))}
.rfbar svg{flex:none}
.rfbar span{flex:1;min-width:0}
.rfbar button{flex:none;border:0;border-radius:10px;background:#fff;color:#2A2A28;font:inherit;font-size:13px;font-weight:600;padding:7px 10px;cursor:pointer}

/* الإصدار 83: كشف المستحقات والدفعات، وتاريخ التسليم، وترتيب الأعمال، وإضافة عمل لاحق */
.slst{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.slst>div{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:10px;min-width:0}
.slst b{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:4px}
.slst .v{font-size:15px;font-weight:600;white-space:nowrap}
.slms{margin-top:6px}
.slm{padding:10px 0;border-bottom:1px solid var(--line)}.slm:last-child{border-bottom:0}
.slm .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.slm .h b{font-weight:600}
.slm .s{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.sltg{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--fill);color:var(--muted)}.sltg.g{background:var(--green-soft);color:var(--green)}.sltg.a{background:#F8F1E4;color:#85642B}
.slbar{height:6px;border-radius:99px;background:var(--fill2);overflow:hidden;margin-top:7px}.slbar i{display:block;height:100%;background:var(--green);border-radius:99px}.slbar i.p{background:#C2954A}
.slp{padding:10px 0;border-bottom:1px solid var(--line)}.slp:last-child{border-bottom:0}
.slp .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.slp .h b{font-weight:600;font-size:15px}
.slp .h .sub{display:flex;align-items:center;gap:4px}
.slp .al{font-size:13px;color:#55554f;margin-top:5px;line-height:1.65;background:var(--fill);border-radius:10px;padding:6px 9px}
.pdate{margin:10px 0 0;background:#fff}
.salact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.salact button{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;color:var(--acc-dk);cursor:pointer}
.slpv{background:var(--fill);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.75}
.slpv b{font-weight:600;display:block}.pdate .dp input{margin-top:0;min-width:0;-webkit-appearance:none;appearance:none}
/* الإصدار 81: صفحة الموظف من اليسار لليمين لما تكون لغته غير العربي */
html[dir=ltr] svg.fl{transform:scaleX(-1)}

html[dir=ltr] .ctitle .sp{margin-left:auto;margin-right:0}
html[dir=ltr] .gr{text-align:left}
html[dir=ltr] .gr+.gr:before{left:58px;right:0}
html[dir=ltr] .sum .badge:last-child{margin-left:auto;margin-right:0}
html[dir=ltr] .tbl td:last-child{text-align:right}
html[dir=ltr] .sc{text-align:left}

html[dir=ltr] .dtog{text-align:left}
html[dir=ltr] .fab{right:18px;left:auto}

html[dir=ltr] .dp select,html[dir=ltr] .dp input{text-align:right}

html[dir=ltr] .shot .x{right:3px;left:auto}
html[dir=ltr] #zv .zx{right:14px;left:auto}
html[dir=ltr] .tbr{text-align:left}
html[dir=ltr] .fxs button.due{text-align:left}
html[dir=ltr] .fxs button.due .chv{right:8px;left:auto}
html[dir=ltr] .fxdue .fqn{text-align:left}

/* الإصدار 102: التصميم «فاتح وناعم بألوان مطفية». طبقة مظهر فوق كل ما قبلها: نفس العناصر والمحتوى، ألوان وأشكال فقط */
html:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--fill:#F4F5F6;--fill2:#E9EBED;--line:#EFF0F2;--line2:#E0E3E6;
  --text:#252A31;--muted:#62676E;--faint:#6A6F76;
  --acc:#557896;--acc-2:#4F7391;--acc-dk:#3F617E;--acc-ink:#FFFFFF;--acc-soft:#EAF0F5;--acc-ring:#CFDAE4;
  --green:#44705A;--green-soft:#EAF2ED;--red:#9C5048;--red-soft:#F7ECEA;--red-line:#EBD5D2;
  --amber:#7D6236;--amber-soft:#F5EFE2;
  --r:16px;--r2:24px;
  --el:0 1px 2px rgba(37,42,49,.04),0 6px 20px rgba(37,42,49,.07);
}
html:root,html:root body{background:var(--bg)!important;color:var(--text)}
html:root body{font-weight:400!important;line-height:1.6}

/* ===== الرأس ===== */
html:root .top{padding:22px 2px 8px!important;align-items:center}
html:root .top h1{font-size:17px;font-weight:600;line-height:1.3}
html:root .top .sub{color:var(--muted)!important;font-size:13px!important;font-weight:400!important;margin-top:1px}
html:root .rf{width:44px!important;height:44px!important;border-radius:50%!important;background:var(--fill)!important;border:0!important;color:var(--text)!important}
html:root .top .back{color:var(--acc-dk)!important;font-size:13px;font-weight:500}
html:root .topr{gap:8px}

/* ===== شريط التنقل السفلي: كبسولة عايمة بأسماء التبويبات ===== */
html:root .tabs{left:12px!important;right:12px!important;bottom:max(10px,env(safe-area-inset-bottom))!important;border-radius:28px!important;border:0!important;box-shadow:0 2px 6px rgba(37,42,49,.06),0 12px 32px rgba(37,42,49,.14)!important;padding:6px!important;background:rgba(255,255,255,.97)!important;gap:2px!important}
html:root .tabs button{font-size:12px!important;color:var(--muted)!important;padding:6px 0 5px!important;gap:2px!important;min-height:52px;font-weight:400;border-radius:22px!important}
html:root .tabs button svg{width:22px;height:22px;stroke-width:1.7}
html:root .tabs button.on{color:var(--acc-dk)!important;font-weight:600!important;background:var(--acc-soft)!important}
html:root .tabs button.on:after{display:none!important}
html:root .fab{border-radius:50%!important;background:var(--acc)!important;box-shadow:0 10px 26px rgba(63,97,126,.28)!important}

/* ===== العناوين الفرعية والنصوص ===== */
html:root .lbl,html:root .lab{color:var(--muted);font-size:13px;font-weight:600;margin:22px 4px 10px}
html:root .lbl svg,html:root .lab svg{color:var(--acc)}
html:root .sech{font-size:15px;font-weight:600;margin:24px 4px 8px}
html:root .sub{color:var(--muted)}
html:root .shh{color:var(--text);font-size:15px;font-weight:600}
html:root .field span{color:var(--muted);font-weight:500;font-size:13px}
html:root .mn{font-weight:600}
html:root .empty{color:var(--muted)}
html:root .tm,html:root .fxh span,html:root .fxt,html:root .ent .d,html:root .gr .n small,html:root .tbh2,html:root .dyh span{color:var(--muted)}

/* ===== البطاقات: بدون حدود ثقيلة، بظل خفيف ===== */
html:root .card,html:root .rpcard,html:root .tfc,html:root .tbl2,html:root .dprops,html:root .rpc{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:var(--el)!important}
html:root .card{padding:18px}

/* ===== الأزرار: دائرية ===== */
html:root .btn{border-radius:999px!important;min-height:52px;padding:13px 18px!important;font-size:15px!important;font-weight:600!important;box-shadow:0 8px 22px rgba(63,97,126,.22)!important;background:var(--acc)!important;color:#fff!important}
html:root .btn2{border-radius:999px!important;min-height:44px;font-weight:500!important;border:0!important;background:var(--fill)!important;color:var(--text)}
html:root .btn2.cu,html:root .bigdo{border-radius:999px!important;font-weight:600!important;background:var(--acc)!important;color:#fff!important;box-shadow:0 6px 16px rgba(63,97,126,.20)!important}

html:root .lnk{color:var(--acc-dk)!important;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
html:root .mbtn{min-height:44px;border-radius:999px;color:var(--acc-dk);background:var(--acc-soft);font-weight:500;padding:0 14px}
html:root .del{color:var(--muted);min-height:44px;min-width:44px;justify-content:center;border-radius:50%}
html:root .del.arm{color:var(--red)}
html:root .fxt button,html:root .fseg .ordb{color:var(--acc-dk)!important;min-height:44px;font-weight:500}
html:root .fxt button.dn{background:var(--acc)!important;color:#fff!important;border-radius:999px!important}
html:root .tbr .ord button{width:44px;height:44px;border-radius:50%}

/* ===== مفتاح التبديل: مسار دائري والمختار أبيض بنص أزرق ===== */
html:root .segc{background:var(--fill)!important;padding:4px!important;gap:2px!important;border-radius:999px!important;justify-content:stretch}
html:root .segc button{flex:1 1 0!important;border:0!important;background:none!important;border-radius:999px!important;padding:0 8px!important;min-height:44px;color:var(--muted)!important;font-weight:500!important;font-size:14px}
html:root .segc button.on{background:var(--surface)!important;color:var(--acc-dk)!important;font-weight:600!important;box-shadow:0 1px 2px rgba(37,42,49,.06),0 3px 10px rgba(37,42,49,.10)!important}
html:root .fseg .segc{flex:1;max-width:260px}

/* ===== شرائح الاختيار: دائرية، والمختار خلفية فاتحة ونص أزرق ===== */
html:root .segc.wr{background:none!important;padding:0!important;gap:8px!important}
html:root .wchips button,html:root .dedch button,html:root .segc.wr button,html:root .chip{flex:0 0 auto!important;border-radius:999px!important;min-height:44px;padding:0 16px!important;border:1.5px solid transparent!important;background:var(--fill)!important;color:var(--text)!important;font-weight:500!important;font-size:14px!important;display:inline-flex;align-items:center;justify-content:center;box-shadow:none!important}
html:root .wchips button.on,html:root .dedch button.on,html:root .segc.wr button.on,html:root .chip.on{background:var(--acc-soft)!important;border-color:var(--acc)!important;color:var(--acc-dk)!important;font-weight:600!important}
html:root .chip.add{background:transparent!important;border:1.5px dashed var(--line2)!important;color:var(--acc-dk)!important}
html:root .chip.on.u{background:var(--red-soft)!important;border-color:var(--red)!important;color:var(--red)!important}
html:root .emp.wr{gap:8px}

/* ===== الحقول: معبّاة ناعمة بدون إطار ===== */
html:root input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),html:root select,html:root textarea{border:1.5px solid transparent!important;background:var(--fill)!important;border-radius:16px!important;color:var(--text);min-height:48px}
html:root input::placeholder,html:root textarea::placeholder{color:var(--faint);opacity:1}
html:root .dp select,html:root .dp input,html:root .dprops input,html:root .dprops select{background:transparent!important;min-height:44px}
html:root .dp input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),html:root .dprops input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]){background:transparent!important}
html:root .qtt{padding:10px 14px!important;font-size:17px;font-weight:600}
html:root .fvf select{border-radius:999px!important;min-height:44px;padding:0 12px}
html:root .pform{background:var(--fill);border-radius:20px}
html:root .pform input,html:root .pform select,html:root .pform textarea,html:root .card input:not([type=checkbox]):not([type=radio]):not([type=file]),html:root .card select,html:root .card textarea{background:var(--fill)!important}
html:root .pform input:not([type=checkbox]):not([type=radio]):not([type=file]),html:root .pform select,html:root .pform textarea{background:var(--surface)!important}
html:root .err{color:var(--red)}

/* ===== النوافذ السفلية ===== */
html:root .sheet{border-radius:32px 32px 0 0!important;padding:10px 20px calc(20px + env(safe-area-inset-bottom))!important;gap:12px;max-height:92vh}
html:root .sheet h3{font-size:17px;font-weight:600}
html:root .grab{width:44px;height:5px;background:var(--fill2)}

/* ===== المهام ===== */
html:root .sc{border-radius:22px!important;min-height:58px!important;border:0!important}
html:root .sc.z{opacity:.8}
html:root .sc b{font-size:17px!important;font-weight:600}
html:root .sc span{font-weight:500!important}
html:root .sc:not(.a):not(.r){color:var(--acc-dk)}

html:root .dtog{color:var(--green);min-height:44px}

/* ===== بطاقات الأرقام: خلفية فاتحة بدون حدود ===== */
html:root .kpi,html:root .fxs div,html:root .fxs button.due{background:var(--fill)!important;border:0!important;border-radius:20px!important;box-shadow:none!important}
html:root .fxs button.due,html:root .fxs div.due{background:var(--red-soft)!important}
html:root .fxs b,html:root .kpi .k{color:var(--muted)!important;font-size:12px;font-weight:500!important}
html:root .fxs div.due b,html:root .fxs button.due b,html:root .fxs div.due small,html:root .fxs button.due small{color:var(--red)!important}
html:root .fxs small,html:root .kpi .v small{color:var(--faint)!important}
html:root .kpi .v,html:root .fxs .tv{font-weight:600!important;font-size:17px!important}

/* ===== القوائم داخل البطاقات ===== */
html:root .tbr{min-height:58px;padding:0 16px}
html:root .tbr .ic{background:var(--acc-soft)!important;color:var(--acc-dk)!important;border-radius:50%;width:34px;height:34px}
html:root .tbr .k,html:root .gr .n,html:root .str .tt,html:root .str b{font-weight:500}
html:root .tbr .v{color:var(--muted)}
html:root .tbr .ch{color:var(--faint)}
html:root .tbh .n b{font-size:17px;font-weight:600}
html:root .tbh .n span{color:var(--muted)}

html:root .tfile .fxbt button{border-radius:20px!important;border:0!important;background:var(--fill)!important;font-weight:500}
html:root .dyh b{font-size:14px;font-weight:600}

/* ===== الملاحظات والوسوم ===== */
html:root .note{border-radius:18px}
html:root .note.good{background:var(--green-soft);color:#3B5A48}
html:root .note.bad{background:var(--red-soft);color:#7A3F39}
html:root .note.info{background:var(--fill);color:var(--muted)}
html:root .badge{border-radius:999px!important;font-weight:500}
html:root .badge.a,html:root .cb,html:root .sc.a{color:#5E4A28!important}
html:root .badge.n{color:var(--text)}
html:root .badge.wait,html:root .wb{color:var(--acc-dk)}
html:root .gb{color:#3B5A48}
html:root .wl.soon{color:var(--amber)}
html:root .wl.end{color:var(--muted)}

/* ===== متفرقات ===== */
html:root .etabs.e4 button .nb{background:var(--fill2);color:var(--text)}
html:root .etabs.e4 button.on .nb{background:var(--acc-soft)!important;color:var(--acc-dk)!important}
html:root .str .ed,html:root .slp .ed{position:relative}

html:root .btn2.rd{background:var(--red-soft)!important;color:var(--red)!important;font-weight:600!important}
html:root .btn2.arm{background:var(--red)!important;color:#fff!important;font-weight:600!important}
html:root .madd{color:var(--acc-dk);border-radius:20px;border-color:var(--acc-ring);background:var(--surface)}

/* ألوان ثابتة في كود التطبيق تتطفى مع الباقي */
html:root .mk.ok{color:var(--green)}html:root .mk.no{color:var(--red)}

/* الإصدار 103: الفرع الرئيسي (عنوان المجموعة أو المشروع) بالأزرق المطفي وتحته خط أزرق فاتح، بنفس مقاس الخط */
/* الإصدار 104: نص المهمة بوزن نص العمل، خط رفيع بين الأعمال في التقارير، وزر «أنجزتها» صغير على نفس سطر المهمة */

/* الإصدار 105: بند الفاتورة، وتقسيم مصروف المشروع حسب البند */
html:root .icat{margin-top:8px}
html:root .ivd .icat{margin-bottom:10px}
html:root .pform .icat button:not(.on){background:var(--surface)!important}
html:root .catb{padding:14px 16px!important}
html:root .cbr+.cbr{margin-top:12px}
html:root .cbl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
html:root .cbl span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
html:root .cbt{height:8px;border-radius:999px;background:var(--fill2);overflow:hidden;margin-top:6px}
html:root .cbt i{display:block;height:100%;border-radius:999px;background:var(--acc)}
html:root .cbt i.n{background:var(--line2)}
/* الإصدار 106: كشف بطاقتي، ميزانية المشروع، ملخص اليوم، زر التصدير */
html:root .fxa .cdb .ci{display:inline-flex;color:var(--acc-dk)}
html:root .cdfl{display:flex;gap:8px;align-items:center;margin:12px 0 0}
html:root .cdfl select{flex:1 1 0;min-width:0}
html:root .cdfl .segc{flex:1 1 0;margin:0}
html:root .cdn{margin:10px 4px 0}
html:root .cdl{padding:2px 8px!important}
html:root .cdr{display:flex;align-items:center;gap:4px;min-height:56px}
html:root .cdr+.cdr{border-top:1px solid var(--line)}
html:root .cdk{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:999px;padding:0}
html:root .cdr.on .cdk{color:var(--green)}
html:root .cdt{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--text);text-align:start;padding:8px 0;cursor:pointer;display:block}
html:root .cdt b{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere}
html:root .cdt .tm{display:block;font-size:12px;color:var(--muted);margin-top:2px}
html:root .cdr.on .cdt b{color:var(--muted)}
html:root .cda{flex:none;font-size:14px;font-weight:600;padding-inline:6px 8px}
html:root .cdk svg{stroke:currentColor}
html:root .bdg{padding:14px 16px!important;margin-top:12px}
html:root .bdh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
html:root .bdh b{font-size:17px;font-weight:600;color:var(--acc-dk)}
html:root .bdh b.a{color:var(--amber)}html:root .bdh b.r{color:var(--red)}
html:root .bdg .cbt{height:10px;margin-top:10px}
html:root .cbt i.a{background:var(--amber)}html:root .cbt i.r{background:var(--red)}
html:root .bdf{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
html:root .sech.xph{justify-content:space-between}
html:root .xpb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--acc-soft);color:var(--acc-dk);font:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative}
html:root .xpb::after{content:"";position:absolute;inset:-2px 0}
/* الإصدار 107: مرفق PDF للفاتورة */
html:root .pdft{width:100%;height:100%;border-radius:12px;background:var(--acc-soft);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3px;padding:8px;color:var(--acc-dk);text-align:start}
html:root .pdft span{font-size:12px;line-height:1.3;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}

(function () {
  const BASE = 'https://isnbhxmdvxokrkytguot.supabase.co';
  const KEY = 'sb_publishable_wwfvIBGULBEEhAozLweCCQ_FqnoJBts';
  const H = { apikey: KEY, 'content-type': 'application/json' };
  async function rpc(fn, args) {
    let r, t = '', j = null;
    try { r = await fetch(BASE + '/rest/v1/rpc/' + fn, { method: 'POST', headers: H, body: JSON.stringify(args || {}) }); t = await r.text(); }
    catch (e) { return { data: null, error: { message: 'Failed to fetch' } }; }
    try { j = t ? JSON.parse(t) : null; } catch (e) {}
    if (!r.ok) return { data: null, error: { message: (j && (j.message || j.error || j.msg)) || 'حدث خطأ، حاول مرة أخرى' } };
    return { data: j, error: null };
  }
  async function files(body) {
    let r, j = null;
    try { r = await fetch(BASE + '/functions/v1/files', { method: 'POST', headers: H, body: JSON.stringify(body) }); j = await r.json().catch(() => null); }
    catch (e) { throw new Error('Failed to fetch'); }
    if (!r.ok) throw new Error((j && j.error) || 'تعذّر الاتصال، حاول مرة أخرى');
    return j || {};

  function put(path, blob, type, onProgress, cred) {
    const c = cred || {};
    return files({ act: 'up', k: c.k || '', t: c.t || '', path: path }).then(r => new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open('PUT', r.url);
      x.setRequestHeader('apikey', KEY);
      x.setRequestHeader('content-type', type || blob.type || 'application/octet-stream');
      if (x.upload && onProgress) x.upload.onprogress = e => { if (e.lengthComputable) onProgress(Math.min(e.loaded / e.total, 0.99)); };
      x.onload = () => { if (x.status >= 200 && x.status < 300) { if (onProgress) onProgress(1); res(path); } else rej(new Error('تعذّر رفع الملف، حاول مرة أخرى')); };
      x.onerror = () => rej(new Error('Failed to fetch'));
      x.send(blob);
    }));
  }

function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function mkAdd(mk, n) { let y = +mk.slice(0, 4), m = +mk.slice(5, 7) + n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2, '0'); }
function showLogin(msg) {
  const td = document.getElementById('tabsDock'); if (td) td.remove();
  $('#fab').classList.add('hide'); document.body.classList.remove('ro');
  $('#app').innerHTML = `<div class="load"><div class="ei">${I('lock', 28)}</div><b style="color:var(--text);font-size:17px">مصاريف البيت</b><br>${esc(msg || 'افتح رابط الدخول اللي وصلك.')}<br><span class="sub">إذا ما عندك رابط، اطلب رابط دخول جديد.</span></div>`;
}
async function loginWith(link) {
  try { const r = await API.apiLogin(link); lsSet('adm_s', r.s); BOOT.key = r.s; loadAdmin(); }
  catch (e) { if (BOOT.key) { loadAdmin(); toastErr(e && e.message || e); } else showLogin(String(e && e.message || e)); }
}
function renderSet() {
  const d = S.data, ro = isRO(), dev = (d.me || {}).role === 'dev', emps = d.allEmps || [];
  const on = emps.filter(e => e.active), off = emps.filter(e => !e.active);
  const v = e => e.active ? M(e.salary, '', 't') + ' · يوم ' + e.payDay : 'موقوف';
  const er = e => ro ? `<div class="tbr ordr${e.active ? '' : ' ar'}"><span class="ic">${I('user', 16)}</span><span class="k">${esc(e.name)}</span><span class="v">${v(e)}</span></div>`
    : `<button class="tbr${e.active ? '' : ' ar'}" onclick="S.es=null;S.armed=null;askEmpSet('${e.id}')"><span class="ic">${I('user', 16)}</span><span class="k">${esc(e.name)}</span><span class="v">${v(e)}</span><span class="ch">${I('chevron-left', 16)}</span></button>`;
  let h = `<div class="tbh2">الموظفين</div><div class="tbl2">${on.map(er).join('')}${ro ? (on.length ? '' : '<div class="tbr ordr"><span class="k sub">لا يوجد موظفين</span></div>') : `<button class="tbr" onclick="S.es=null;askEmpSet('')"><span class="ic add">${I('plus', 16)}</span><span class="k acc">إضافة موظف</span></button>`}</div>`;
  if (off.length) h += `<div class="tbl2" style="margin-top:8px">${off.map(er).join('')}</div>`;
  if (dev) h += `<div class="tbh2">المشرفين</div><div class="tbl2">${(d.admins || []).map(a => `<button class="tbr${a.active ? '' : ' ar'}" onclick="S.ss=null;S.armed=null;askSupSet('${a.id}')"><span class="ic">${I('lock', 16)}</span><span class="k">${esc(a.name)}</span><span class="v">${!a.active ? 'موقوف' : a.link ? 'رابطه ما استُخدم' : 'صلاحية كاملة'}</span><span class="ch">${I('chevron-left', 16)}</span></button>`).join('')}<button class="tbr" onclick="S.ss=null;askSupSet('')"><span class="ic add">${I('plus', 16)}</span><span class="k acc">إضافة مشرف</span></button></div>`;
  h += `<div class="tbh2">هذا الجهاز</div><div class="tbl2"><button class="tbr" onclick="askOut()"><span class="ic">${I('log-out', 16)}</span><span class="k">تسجيل الخروج</span><span class="v">${esc((d.me || {}).name || '')}</span></button></div><div style="height:30px"></div>`;
  $('#view').innerHTML = h;
}
function linkBox(url, onNew, armKey) {
  return `<div class="link">${esc(url)}</div>
    <div class="grid2" style="margin-top:-4px"><button class="btn2" onclick="copy('${esc(url)}')">${I('copy', 15)}انسخ</button><button class="btn2 ${S.armed === armKey ? 'arm' : ''}" onclick="${onNew}">${I('rotate-ccw', 15)}${S.armed === armKey ? 'متأكد؟ اضغط مرة ثانية' : 'رابط جديد'}</button></div>`;
}
function askEmpSet(id) {
  if (isRO()) return;
  const d = S.data, e = (d.allEmps || []).find(x => x.id === id), mk = d.today.slice(0, 7);
  if (!S.es || S.es.id !== id) S.es = e ? {id: e.id, name: e.name, salary: String(e.salary), payDay: e.payDay || 28, payNext: !!e.payNext, lang: e.lang || 'ar', start: e.start || mk}
    : {id: '', name: '', salary: '', payDay: 28, payNext: false, lang: 'ar', start: mk};
  const f = S.es, months = [];
  for (let i = -12; i <= 1; i++) months.push(mkAdd(mk, i));
  if (!months.includes(f.start)) months.unshift(f.start);
  const days = Array.from({length: 28}, (_, i) => `<option value="${i + 1}" ${+f.payDay === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('');
  const url = e && e.token ? BOOT.url + '?e=' + e.token : '';
  ovOpen(`<label class="shh">${e ? esc(e.name) : 'موظف جديد'}</label>
    <input placeholder="الاسم" value="${esc(f.name)}" oninput="S.es.name=this.value">
    <div class="dprops" style="margin-top:0">
      <label class="dp"><span>الراتب الشهري</span><input inputmode="decimal" placeholder="0" value="${esc(f.salary)}" oninput="S.es.salary=this.value"></label>
      <label class="dp"><span>يوم الصرف</span><select onchange="S.es.payDay=+this.value">${days}</select></label>
      <label class="dp"><span>أول شهر راتب</span><select onchange="S.es.start=this.value">${months.map(m => `<option value="${m}" ${f.start === m ? 'selected' : ''}>${esc(monthLbl(m))}</option>`).join('')}</select></label>
    </div>
    <div class="sub" style="margin-top:-4px">الرواتب تنحسب له من هذا الشهر.</div>
    <label class="tgl"><span>يُصرف راتب الشهر في الشهر اللي بعده</span><input type="checkbox" ${f.payNext ? 'checked' : ''} onchange="S.es.payNext=this.checked"></label>
    <div class="sub" style="margin:4px 0 -2px">لغة صفحته</div>
    <div class="segc wr">${LANGS.map(l => `<button class="${f.lang === l[0] ? 'on' : ''}" onclick="S.es.lang='${l[0]}';chipOn(this)">${l[1]}</button>`).join('')}</div>
    ${e ? `<div class="sub" style="margin:6px 0 -6px">رابط صفحته</div>${linkBox(url, `empNewLink('${id}')`, 'elk_' + id)}<div class="sub">الرابط الجديد يوقف القديم.</div>` : '<div class="sub">رابط صفحته يطلع بعد الحفظ.</div>'}
    <div class="err" id="eserr"></div>
    <div class="g21"><button class="btn2 cu" onclick="doEmpSet()">حفظ</button><button class="btn2" onclick="S.es=null;S.armed=null;ovClose()">إلغاء</button></div>
    ${e ? (e.active ? `<button class="lnk dl" onclick="empStop('${id}', false)">${S.armed === 'est_' + id ? 'متأكد؟ اضغط مرة ثانية للإيقاف' : 'أوقف الموظف'}</button><div class="sub" style="margin-top:-8px">يختفي من القوائم، وتبقى فواتيره ورواتبه.</div>` : `<button class="lnk" onclick="empStop('${id}', true)">رجّع الموظف</button>`) : ''}`);
}
async function doEmpSet() {
  const f = S.es; if (!f) return;
  const err = m => { const x = $('#eserr'); if (x) x.textContent = m; };
  if (!String(f.name || '').trim()) return err('اكتب الاسم');
  const sal = API.parseAmt(f.salary);
  if (!(sal >= 0)) return err('اكتب الراتب');
  const un = lockBtn('جاري الحفظ…');
  try {
    const r = await call('apiEmpSave', BOOT.key, {id: f.id, name: f.name.trim(), salary: String(sal), payDay: f.payDay, payNext: !!f.payNext, lang: f.lang, start: f.start});
    S.data = r; S.es = null; S.armed = null; renderAdmin();
    if (!f.id && r.__r && r.__r.id) { askEmpSet(r.__r.id); toast('تم الحفظ', null, 'ok', 'انسخ رابط صفحته وأرسله له'); }
    else { ovClose(); toast('تم الحفظ'); }
  } catch (e) { un(); err(e); }
}
async function empNewLink(id) {
  if (S.armed !== 'elk_' + id) { S.armed = 'elk_' + id; return askEmpSet(id); }
  try { S.data = await call('apiEmpLink', BOOT.key, id); S.armed = null; renderAdmin(); askEmpSet(id); toast('تغيّر الرابط', null, 'ok', 'أرسل الرابط الجديد له'); }
  catch (e) { S.armed = null; toastErr(e); }
}
async function empStop(id, on) {
  if (!on && S.armed !== 'est_' + id) { S.armed = 'est_' + id; return askEmpSet(id); }
  try { S.data = await call('apiEmpActive', BOOT.key, id, on); S.armed = null; S.es = null; ovClose(); renderAdmin(); toast(on ? 'رجع الموظف' : 'توقّف الموظف'); }
  catch (e) { S.armed = null; toastErr(e); }
}
function askSupSet(id) {
  const d = S.data, a = (d.admins || []).find(x => x.id === id);
  if (!S.ss || S.ss.id !== id) S.ss = {id: id, name: a ? a.name : ''};
  const f = S.ss, url = a && a.link ? BOOT.url + '?k=' + a.link : '';
  ovOpen(`<label class="shh">${a ? esc(a.name) : 'مشرف جديد'}</label>
    <input placeholder="الاسم" value="${esc(f.name)}" oninput="S.ss.name=this.value">
    <div class="sub">صلاحية كاملة: يعتمد ويرجّع ويصحح، ويصرف الرواتب، ويطابق البطاقات، ويضيف الموظفين.</div>
    ${a ? `<div class="sub" style="margin:6px 0 -6px">رابط دخوله</div>${url ? linkBox(url, `supNewLink('${id}')`, 'slk_' + id) : `<div class="note info">${I('info', 16)}<div>دخل برابطه. إذا احتاج يدخل من جهاز ثاني، أعطه رابط جديد.</div></div><button class="btn2 ${S.armed === 'slk_' + id ? 'arm' : ''}" onclick="supNewLink('${id}')">${I('rotate-ccw', 15)}${S.armed === 'slk_' + id ? 'متأكد؟ اضغط مرة ثانية' : 'رابط جديد'}</button>`}
      <div class="sub">الرابط يشتغل مرة وحدة ويتحول لجلسة في جواله. الرابط الجديد يطلّعه من أجهزته.</div>` : '<div class="sub">رابط دخوله يطلع بعد الحفظ.</div>'}
    <div class="err" id="sserr"></div>
    <div class="g21"><button class="btn2 cu" onclick="doSupSet()">حفظ</button><button class="btn2" onclick="S.ss=null;S.armed=null;ovClose()">إلغاء</button></div>
    ${a ? (a.active ? `<button class="lnk dl" onclick="supStop('${id}', false)">${S.armed === 'sst_' + id ? 'متأكد؟ اضغط مرة ثانية للإيقاف' : 'أوقف المشرف'}</button><div class="sub" style="margin-top:-8px">ينقفل دخوله، ويبقى اسمه على الفواتير اللي اعتمدها.</div>` : `<button class="lnk" onclick="supStop('${id}', true)">رجّع المشرف</button>`) : ''}`);
}
async function doSupSet() {
  const f = S.ss; if (!f) return;
  if (!String(f.name || '').trim()) { const x = $('#sserr'); if (x) x.textContent = 'اكتب الاسم'; return; }
  const un = lockBtn('جاري الحفظ…');
  try {
    const r = await call('apiAdmSave', BOOT.key, {id: f.id, name: f.name.trim()});
    S.data = r; S.ss = null; S.armed = null; renderAdmin();
    if (!f.id && r.__r && r.__r.id) { askSupSet(r.__r.id); toast('تم الحفظ', null, 'ok', 'انسخ رابط دخوله وأرسله له'); }
    else { ovClose(); toast('تم الحفظ'); }
  } catch (e) { un(); const x = $('#sserr'); if (x) x.textContent = e; }
}
async function supNewLink(id) {
  if (S.armed !== 'slk_' + id) { S.armed = 'slk_' + id; return askSupSet(id); }
  try { S.data = await call('apiAdmLink', BOOT.key, id); S.armed = null; renderAdmin(); askSupSet(id); toast('تغيّر الرابط', null, 'ok', 'أرسل الرابط الجديد له'); }
  catch (e) { S.armed = null; toastErr(e); }
}
async function supStop(id, on) {
  if (!on && S.armed !== 'sst_' + id) { S.armed = 'sst_' + id; return askSupSet(id); }
  try { S.data = await call('apiAdmActive', BOOT.key, id, on); S.armed = null; S.ss = null; ovClose(); renderAdmin(); toast(on ? 'رجع المشرف' : 'توقّف المشرف'); }
  catch (e) { S.armed = null; toastErr(e); }
}
function askOut() {
  ovOpen(`<label class="shh">تسجيل الخروج من هذا الجهاز؟</label><div class="sub">يرجع الدخول برابط دخول جديد.</div>
    <div class="g21"><button class="btn2 arm" onclick="doLogout()">اخرج</button><button class="btn2" onclick="ovClose()">إلغاء</button></div>`);
}
async function doLogout() {
  const k = BOOT.key;
  try { await call('apiLogout', k); } catch (e) {}
  lsDel('adm_s'); BOOT.key = ''; S.data = null; ovClose(); showLogin('سجّلت الخروج.');
}
function startView(d) {
  if (((d.inv || {}).items || []).some(x => x.kind === 'inv' && x.status === 'review')) return 'fin';
  const v = lsGet('adm_view');
  return ['team', 'fin', 'set'].includes(v) ? v : 'fin';
}
function ovGuard() { return false; }
function ovTryClose() { ovClose(); }
ICONS['alarm-clock'] = '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/>';
function subHead() {
  const v = document.getElementById('view'), top = document.querySelector('#app .top');
  if (!v || !top) return;
  const h1 = top.querySelector('h1');
  top.querySelectorAll('.back').forEach(b => b.remove());
  top.classList.remove('subp');
  h1.textContent = ({rec:'التقييم', team:'الفريق', task:'الأعمال', fin:'المالية', set:'الإعدادات'})[S.view] || 'إدارة العمل';
  const back = v.querySelector(':scope > .back');
  if (!back) return;
  const h2 = v.querySelector(':scope > .fxh h2, :scope > h2');
  if (h2) {
    h1.textContent = h2.textContent;
    const fx = h2.parentNode.classList.contains('fxh') ? h2.parentNode : null, sp = fx && fx.querySelector('span');
    if (fx && (!sp || /^\d*$/.test(sp.textContent.trim()))) fx.remove(); else h2.remove();
  }
  top.classList.add('subp');
  h1.parentNode.insertBefore(back, h1);
}
let SHD = 0;
['renderTeam', 'renderFin', 'renderSet'].forEach(n => { const o = window[n]; window[n] = function () { SHD++; let r; try { r = o.apply(this, arguments); } finally { SHD--; } if (!SHD) subHead(); return r; }; });
if (BOOT.page === 'admin') { if (BOOT.legacy) loginWith(BOOT.legacy); else if (BOOT.key) loadAdmin(); else showLogin(); }
else if (BOOT.page === 'emp') loadEmp();
else $('#app').innerHTML = '<div class="load"><div class="ei">' + I('link', 28) + '</div><b style="color:var(--text);font-size:17px">الرابط غير صالح</b><br>تأكد من الرابط الذي وصلك، أو اطلب رابطاً جديداً.</div>';
</script>
